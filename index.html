<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrayerConnect</title>
    <meta name="description" content="PrayerConnect — gratis gebedsplatform voor kerken" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { --bg:#FFFBF5; --fg:#2D2A32; --muted:#F6EFE6; --border:#E9DCC8; --primary:#6B46C1; --gold:#D69E2E; --blue:#63B3ED; --card:#FFFFFF; --shadow:0 12px 40px rgba(107,70,193,.10); }
      * { box-sizing:border-box; } html,body { margin:0; padding:0; } body { font-family:'Inter',system-ui,sans-serif; background:radial-gradient(circle at top, rgba(107,70,193,.15), transparent 35%), var(--bg); color:var(--fg); }
      a { color:inherit; } .container { max-width:1180px; margin:0 auto; padding:20px; } .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; }
      .brand { display:flex; align-items:center; gap:14px; font-weight:700; text-decoration:none; } .brand-badge { width:46px; height:46px; border-radius:18px; background:var(--primary); color:white; display:grid; place-items:center; box-shadow:var(--shadow); font-size:20px; }
      .nav,.actions,.subnav,.chips { display:flex; gap:10px; flex-wrap:wrap; } .btn { border:0; border-radius:18px; padding:12px 16px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
      .btn-primary { background:var(--primary); color:white; } .btn-outline { background:white; border:1px solid var(--border); color:var(--fg); }
      .hero { display:grid; gap:20px; grid-template-columns:1.15fr .85fr; padding:22px 0 30px; } .card,.request-card { background:var(--card); border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow); padding:22px; }
      .badge { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; background:rgba(214,158,46,.14); color:#9a6a08; font-size:13px; font-weight:700; }
      h1 { font-size:clamp(2.2rem,4.2vw,4.6rem); line-height:1.02; margin:16px 0; } h2 { font-size:clamp(1.35rem,2.5vw,2rem); margin:0 0 10px; } h3 { margin:0 0 8px; font-size:1.05rem; }
      p { color:rgba(45,42,50,.78); line-height:1.7; } .muted { color:rgba(45,42,50,.62); } .stats,.features,.dashboard-grid,.requests-grid,.list { display:grid; gap:16px; }
      .stats { grid-template-columns:repeat(3,1fr); margin-top:20px; } .features { grid-template-columns:repeat(4,1fr); margin:18px 0 28px; } .dashboard-grid { grid-template-columns:repeat(4,1fr); } .requests-grid { grid-template-columns:1fr 360px; align-items:start; }
      .preview { background:linear-gradient(140deg,#6B46C1,#8157d8 60%,#63B3ED 130%); color:white; } .preview p,.preview .muted { color:rgba(255,255,255,.9); }
      .chip { padding:6px 10px; border-radius:999px; font-size:12px; font-weight:700; background:rgba(107,70,193,.1); color:var(--primary); } .chip.gold { background:rgba(214,158,46,.14); color:#9a6a08; } .chip.dark { background:rgba(45,42,50,.08); color:var(--fg); }
      .meta { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px; color:rgba(45,42,50,.62); font-size:14px; }
      form { display:grid; gap:12px; } input,textarea,select { width:100%; border:1px solid var(--border); background:white; border-radius:18px; padding:12px 14px; font:inherit; color:var(--fg); } textarea { min-height:120px; resize:vertical; }
      label { font-size:14px; font-weight:600; margin-bottom:6px; display:block; } .panel { margin-top:14px; } .empty { padding:18px; background:var(--muted); border-radius:18px; color:rgba(45,42,50,.68); }
      .footer { padding:36px 0 50px; color:rgba(45,42,50,.6); font-size:14px; } .small { font-size:13px; } .link { color:var(--primary); text-decoration:none; font-weight:600; } .notice { background:rgba(99,179,237,.16); color:#184b73; border-radius:18px; padding:14px; font-size:14px; }
      @media (max-width:980px){ .hero,.requests-grid{grid-template-columns:1fr;} .features{grid-template-columns:repeat(2,1fr);} .dashboard-grid{grid-template-columns:repeat(2,1fr);} .stats{grid-template-columns:1fr;} }
      @media (max-width:640px){ .features,.dashboard-grid{grid-template-columns:1fr;} .topbar{align-items:flex-start; flex-direction:column;} }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar"><a class="brand" href="#/"><div class="brand-badge">🤝</div><div><div>PrayerConnect</div><div class="muted small">Gratis gebedsplatform voor kerken</div></div></a><nav class="nav"><a class="btn btn-outline" href="#/login">Inloggen</a><a class="btn btn-primary" href="#/register">Start gratis</a></nav></header>
      <main id="app"></main>
      <footer class="footer">PrayerConnect · GitHub Pages + Supabase · gebouwd voor warme, toegankelijke betrokkenheid</footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://iatehwjwhmhvcujroxka.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdGVod2p3aG1odmN1anJveGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTE3MDMsImV4cCI6MjA5MDYyNzcwM30.QArrIXoD5ekkM0XuqJrGVD4qCAafTurWe33uGPQjTeM';
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const app = document.getElementById('app');
      function slugify(text){ return text.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
      function formatDate(value){ try { return new Date(value).toLocaleString('nl-NL',{dateStyle:'medium',timeStyle:'short'}); } catch { return value; } }
      function esc(value){ return String(value ?? '').replace(/[&<>"']/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
      function currentHash(){ return location.hash.replace(/^#/,'') || '/'; }
      function churchWallUrl(slug){ return `${location.origin}${location.pathname}#/kerk/${slug}/gebedsmuur`; }
      async function getChurchBySlug(slug){ const {data,error}=await supabaseClient.from('churches').select('*').eq('slug',slug).maybeSingle(); if(error) throw error; return data; }
      async function getPublicRequests(churchId){ const {data,error}=await supabaseClient.from('prayer_request_stats').select('*').eq('church_id',churchId).eq('visibility','openbaar').eq('approved',true).order('created_at',{ascending:false}); if(error) throw error; return data||[]; }
      async function getDashboardStats(churchId){ const {data,error}=await supabaseClient.from('prayer_request_stats').select('*').eq('church_id',churchId).order('created_at',{ascending:false}); if(error) throw error; const all=data||[]; return { open: all.filter(r=>r.status==='open'||r.status==='in_gebed').length, answered: all.filter(r=>r.status==='beantwoord').length, publicCount: all.filter(r=>r.visibility==='openbaar').length, totalPrayers: all.reduce((s,r)=>s+(r.prayers_count||0),0) }; }
      async function ensureLeaderChurch(){ const {data:authData}=await supabaseClient.auth.getUser(); const user=authData?.user; if(!user) return null; const {data:membership}=await supabaseClient.from('church_members').select('church_id, role').eq('user_id',user.id).order('created_at',{ascending:true}).limit(1).maybeSingle(); if(!membership) return null; const {data:church}=await supabaseClient.from('churches').select('*').eq('id',membership.church_id).maybeSingle(); return church; }
      function requestCard(request,showAdmin=false){ return `<div class="request-card"><div class="chips"><span class="chip">${esc(request.category||'algemeen')}</span><span class="chip gold">${esc(request.priority||'normaal')}</span>${request.visibility==='prive'?'<span class="chip dark">privé</span>':''}${request.status?`<span class="chip dark">${esc(request.status)}</span>`:''}</div><h3>${esc(request.title)}</h3><p>${esc(request.description)}</p><div class="meta"><div>${esc(request.author_name||'Anoniem')} · ${formatDate(request.created_at)}</div><div>🙏 ${request.prayers_count||0} · 💬 ${request.comments_count||0}</div></div><div class="actions">${request.visibility==='openbaar'?`<button class="btn btn-primary" data-pray="${request.id}">Ik bid mee</button>`:''}${showAdmin?`<button class="btn btn-outline" data-approve="${request.id}">Goedkeuren</button><button class="btn btn-outline" data-answer="${request.id}">Beantwoord</button>`:''}</div></div>`; }
      function homeView(){ return `<section class="hero"><div class="card"><span class="badge">Volledig gratis voor kerken</span><h1>Breng je gemeente samen in gebed</h1><p>PrayerConnect helpt kerken om gebedsverzoeken warm, eenvoudig en mobielvriendelijk te delen. Leiders beheren alles in één dashboard, bezoekers kunnen zonder login de gebedsmuur gebruiken.</p><div class="actions"><a class="btn btn-primary" href="#/register">Start gratis</a><a class="btn btn-outline" href="#/login">Inloggen</a></div><div class="stats"><div class="card" style="box-shadow:none;background:var(--muted)"><div class="muted">Publieke gebedsmuur</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">Open</div></div><div class="card" style="box-shadow:none;background:var(--muted)"><div class="muted">Leidersdashboard</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">Rustig</div></div><div class="card" style="box-shadow:none;background:var(--muted)"><div class="muted">Kosten</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">€0</div></div></div></div><div class="card preview"><div class="muted">Warm, rustig, spiritueel</div><h2>Voor gemeenteleven dat dichtbij voelt</h2><p>Gebedsverzoeken, delen met link, betrokkenheid volgen en veilig beheren per kerk.</p></div></section><section class="features"><div class="card"><h3>Openbare gebedsmuur</h3><p>Iedereen kan verzoeken lezen en zelf een nieuw verzoek delen.</p></div><div class="card"><h3>Leidersdashboard</h3><p>Beheer verzoeken, team en instellingen in één overzicht.</p></div><div class="card"><h3>Delen met link</h3><p>Elke kerk heeft een eigen slug en deelbare muur.</p></div><div class="card"><h3>Mobiel-first</h3><p>Ontworpen voor snel gebruik op telefoon.</p></div></section>`; }
      function loginView(){ return `<section class="card"><h2>Inloggen als leider</h2><p>Gebruik je account om je kerk te beheren.</p><form id="login-form" class="panel"><div><label>E-mailadres</label><input type="email" name="email" required></div><div><label>Wachtwoord</label><input type="password" name="password" required></div><button class="btn btn-primary" type="submit">Inloggen</button><div id="login-message" class="small muted"></div></form></section>`; }
      function registerView(){ return `<section class="card"><h2>Maak gratis een kerkaccount aan</h2><p>Je maakt een account en je kerk in één keer aan.</p><div class="notice">Na registratie maakt Supabase automatisch je kerk en admin-lidmaatschap aan.</div><form id="register-form" class="panel"><div><label>Jouw naam</label><input name="name" required></div><div><label>Naam van je kerk</label><input name="church_name" required></div><div><label>Locatie</label><input name="location"></div><div><label>Denominatie</label><input name="denomination"></div><div><label>E-mailadres</label><input type="email" name="email" required></div><div><label>Wachtwoord</label><input type="password" name="password" minlength="6" required></div><button class="btn btn-primary" type="submit">Account en kerk aanmaken</button><div id="register-message" class="small muted"></div></form></section>`; }
      function wallView(church,requests){ const shareUrl=churchWallUrl(church.slug); return `<section class="requests-grid"><div><div class="card"><span class="badge">${esc(church.name)}</span><h2>Gebedsmuur</h2><p>Deel een gebedsverzoek, bid mee met anderen en blijf als gemeente betrokken.</p><div class="actions"><a class="btn btn-outline" href="#/kerk/${encodeURIComponent(church.slug)}/delen">Deel deze muur</a><a class="btn btn-primary" href="${shareUrl}" target="_blank" rel="noreferrer">Open directe link</a></div></div><div class="list panel">${requests.length?requests.map(r=>requestCard(r)).join(''):'<div class="empty">Nog geen openbare gebedsverzoeken.</div>'}</div></div><aside class="card"><h3>Plaats een gebedsverzoek</h3><p>Je kunt met naam of anoniem posten.</p><form id="public-request-form"><input type="hidden" name="church_id" value="${esc(church.id)}"><div><label>Naam (optioneel)</label><input name="author_name"></div><div><label>Titel</label><input name="title" required></div><div><label>Beschrijving</label><textarea name="description" required></textarea></div><div><label>Categorie</label><select name="category"><option value="algemeen">algemeen</option><option value="ziekte">ziekte</option><option value="familie">familie</option><option value="werk">werk</option><option value="geestelijk_leven">geestelijk leven</option></select></div><div><label>Prioriteit</label><select name="priority"><option value="normaal">normaal</option><option value="urgent">urgent</option><option value="laag">laag</option></select></div><button class="btn btn-primary" type="submit">Verzoek delen</button><div id="public-request-message" class="small muted"></div></form></aside></section>`; }
      function shareView(church){ const url=churchWallUrl(church.slug); return `<section class="card"><h2>Deel je gebedsmuur</h2><p>Gebruik deze link in je nieuwsbrief, WhatsAppgroep of website.</p><div class="panel"><label>Directe link</label><input value="${esc(url)}" readonly></div><div class="panel"><label>Embed code</label><textarea readonly>&lt;iframe src=&quot;${esc(url)}&quot; width=&quot;100%&quot; height=&quot;760&quot; style=&quot;border:none;border-radius:24px;&quot;&gt;&lt;/iframe&gt;</textarea></div></section>`; }
      function dashboardView(church,stats,requests){ return `<section><div class="card"><span class="badge">Leidersdashboard · ${esc(church.name)}</span><h2>Dashboard</h2><p>Overzicht van open verzoeken, antwoorden en betrokkenheid in jullie kerk.</p><div class="subnav"><a class="btn btn-outline" href="#/dashboard/verzoeken">Verzoeken</a><a class="btn btn-outline" href="#/dashboard/nieuw">Nieuw verzoek</a><a class="btn btn-outline" href="#/kerk/${encodeURIComponent(church.slug)}/gebedsmuur">Publieke muur</a><button class="btn btn-primary" id="logout-btn">Uitloggen</button></div></div><div class="dashboard-grid panel"><div class="card"><div class="muted">Open verzoeken</div><div style="font-size:2rem;font-weight:800;">${stats.open}</div></div><div class="card"><div class="muted">Beantwoorde gebeden</div><div style="font-size:2rem;font-weight:800;">${stats.answered}</div></div><div class="card"><div class="muted">Openbaar zichtbaar</div><div style="font-size:2rem;font-weight:800;">${stats.publicCount}</div></div><div class="card"><div class="muted">Totaal bid mee</div><div style="font-size:2rem;font-weight:800;">${stats.totalPrayers}</div></div></div><div class="list panel">${requests.length?requests.map(r=>requestCard(r,true)).join(''):'<div class="empty">Nog geen verzoeken gevonden.</div>'}</div></section>`; }
      function newRequestView(){ return `<section class="card"><h2>Nieuw gebedsverzoek</h2><p>Voeg als leider een verzoek toe voor de gebedsmuur of intern gebruik.</p><form id="leader-request-form" class="panel"><div><label>Titel</label><input name="title" required></div><div><label>Beschrijving</label><textarea name="description" required></textarea></div><div><label>Auteur</label><input name="author_name"></div><div><label>Categorie</label><select name="category"><option value="algemeen">algemeen</option><option value="ziekte">ziekte</option><option value="familie">familie</option><option value="werk">werk</option><option value="geestelijk_leven">geestelijk leven</option></select></div><div><label>Prioriteit</label><select name="priority"><option value="normaal">normaal</option><option value="urgent">urgent</option><option value="laag">laag</option></select></div><div><label>Zichtbaarheid</label><select name="visibility"><option value="openbaar">openbaar</option><option value="prive">prive</option></select></div><button class="btn btn-primary" type="submit">Verzoek opslaan</button><div id="leader-request-message" class="small muted"></div></form></section>`; }
      async function render(){ const route=currentHash(); try { if(route==='/'||route===''){ app.innerHTML=homeView(); return; } if(route==='/login'){ app.innerHTML=loginView(); return bindLogin(); } if(route==='/register'){ app.innerHTML=registerView(); return bindRegister(); } if(route.startsWith('/kerk/')){ const match=route.match(/^\/kerk\/([^/]+)\/(gebedsmuur|delen)$/); if(!match){ app.innerHTML='<section class="card"><h2>Pagina niet gevonden</h2></section>'; return; } const slug=decodeURIComponent(match[1]); const page=match[2]; const church=await getChurchBySlug(slug); if(!church){ app.innerHTML='<section class="card"><h2>Kerk niet gevonden</h2><p>Controleer de link of maak eerst een kerk aan.</p></section>'; return; } if(page==='delen'){ app.innerHTML=shareView(church); return; } const requests=await getPublicRequests(church.id); app.innerHTML=wallView(church,requests); bindPublicRequestForm(church.id); bindPrayButtons(); return; } if(route.startsWith('/dashboard')){ const {data:authData}=await supabaseClient.auth.getSession(); if(!authData?.session){ location.hash='#/login'; return; } const church=await ensureLeaderChurch(); if(!church){ app.innerHTML='<section class="card"><h2>Kerk wordt nog klaargezet</h2><p>Je account is aangemaakt, maar de kerk-setup is nog niet zichtbaar. Probeer over een paar seconden opnieuw in te loggen.</p></section>'; return; } const stats=await getDashboardStats(church.id); const {data:requests,error}=await supabaseClient.from('prayer_request_stats').select('*').eq('church_id',church.id).order('created_at',{ascending:false}); if(error) throw error; if(route==='/dashboard/nieuw'){ app.innerHTML=newRequestView(); bindLeaderRequestForm(church.id); return; } app.innerHTML=dashboardView(church,stats,requests||[]); bindDashboardActions(); return; } app.innerHTML='<section class="card"><h2>Pagina niet gevonden</h2></section>'; } catch(error){ console.error(error); app.innerHTML=`<section class="card"><h2>Er ging iets mis</h2><p>${esc(error.message||'Onbekende fout')}</p></section>`; } }
      function bindLogin(){ const form=document.getElementById('login-form'); const msg=document.getElementById('login-message'); form?.addEventListener('submit', async (e)=>{ e.preventDefault(); msg.textContent='Bezig met inloggen...'; const fd=new FormData(form); const {error}=await supabaseClient.auth.signInWithPassword({ email:fd.get('email'), password:fd.get('password') }); if(error){ msg.textContent=error.message; return; } location.hash='#/dashboard'; }); }
      function bindRegister(){ const form=document.getElementById('register-form'); const msg=document.getElementById('register-message'); form?.addEventListener('submit', async (e)=>{ e.preventDefault(); msg.textContent='Account en kerk worden aangemaakt...'; const fd=new FormData(form); const churchName=String(fd.get('church_name')||'').trim(); const { error } = await supabaseClient.auth.signUp({ email:String(fd.get('email')||''), password:String(fd.get('password')||''), options:{ data:{ full_name:String(fd.get('name')||''), church_name:churchName, location:String(fd.get('location')||''), denomination:String(fd.get('denomination')||'') } } }); if(error){ msg.textContent=error.message; return; } msg.textContent='Registratie gelukt. Je kunt nu direct inloggen; je kerk wordt automatisch aangemaakt.'; setTimeout(()=>location.hash='#/login', 1000); }); }
      function bindPublicRequestForm(churchId){ const form=document.getElementById('public-request-form'); const msg=document.getElementById('public-request-message'); form?.addEventListener('submit', async (e)=>{ e.preventDefault(); msg.textContent='Verzoek wordt verzonden...'; const fd=new FormData(form); const payload={ church_id:churchId, author_name:String(fd.get('author_name')||'').trim()||'Anoniem', title:String(fd.get('title')||'').trim(), description:String(fd.get('description')||'').trim(), category:String(fd.get('category')||'algemeen'), priority:String(fd.get('priority')||'normaal'), visibility:'openbaar', status:'open', approved:false }; const {error}=await supabaseClient.from('prayer_requests').insert(payload); if(error){ msg.textContent=error.message; return; } form.reset(); msg.textContent='Dankjewel. Je verzoek is ontvangen en verschijnt na goedkeuring.'; }); }
      function bindLeaderRequestForm(churchId){ const form=document.getElementById('leader-request-form'); const msg=document.getElementById('leader-request-message'); form?.addEventListener('submit', async (e)=>{ e.preventDefault(); msg.textContent='Opslaan...'; const fd=new FormData(form); const payload={ church_id:churchId, author_name:String(fd.get('author_name')||'').trim()||'Leiderschap', title:String(fd.get('title')||'').trim(), description:String(fd.get('description')||'').trim(), category:String(fd.get('category')||'algemeen'), priority:String(fd.get('priority')||'normaal'), visibility:String(fd.get('visibility')||'openbaar'), status:'open', approved:true }; const {error}=await supabaseClient.from('prayer_requests').insert(payload); if(error){ msg.textContent=error.message; return; } msg.textContent='Verzoek opgeslagen.'; setTimeout(()=>location.hash='#/dashboard/verzoeken',500); }); }
      function bindPrayButtons(){ document.querySelectorAll('[data-pray]').forEach((button)=>{ button.addEventListener('click', async ()=>{ const requestId=button.getAttribute('data-pray'); const {data:authData}=await supabaseClient.auth.getUser(); const user=authData?.user; if(!user){ alert('Log eerst in om “Ik bid mee” te gebruiken.'); location.hash='#/login'; return; } const {error}=await supabaseClient.from('prayer_engagements').insert({ request_id:requestId, user_id:user.id }); if(error){ alert(error.message.includes('duplicate')?'Je bidt al mee met dit verzoek.':error.message); return; } alert('Dankjewel — je bidt mee.'); render(); }); }); }
      function bindDashboardActions(){ document.getElementById('logout-btn')?.addEventListener('click', async ()=>{ await supabaseClient.auth.signOut(); location.hash='#/'; }); document.querySelectorAll('[data-approve]').forEach((button)=>{ button.addEventListener('click', async ()=>{ const id=button.getAttribute('data-approve'); const {error}=await supabaseClient.from('prayer_requests').update({ approved:true }).eq('id',id); if(error) return alert(error.message); render(); }); }); document.querySelectorAll('[data-answer]').forEach((button)=>{ button.addEventListener('click', async ()=>{ const id=button.getAttribute('data-answer'); const {error}=await supabaseClient.from('prayer_requests').update({ status:'beantwoord' }).eq('id',id); if(error) return alert(error.message); render(); }); }); }
      window.addEventListener('hashchange', render); supabaseClient.auth.onAuthStateChange(()=>{ if(currentHash().startsWith('/dashboard')||currentHash()==='/login') render(); }); render();
    </script>
  </body>
</html>
