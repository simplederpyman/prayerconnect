<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrayerConnect</title>
    <meta name="description" content="PrayerConnect — gratis gebedsplatform voor kerken" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #fffbf5;
        --fg: #2d2a32;
        --muted: #f6efe6;
        --border: #e9dcc8;
        --primary: #6b46c1;
        --gold: #d69e2e;
        --card: rgba(255,255,255,.9);
        --shadow: 0 12px 40px rgba(107, 70, 193, 0.10);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--fg);
        background:
          radial-gradient(circle at top, rgba(107,70,193,.16), transparent 34%),
          radial-gradient(circle at bottom right, rgba(214,158,46,.12), transparent 28%),
          var(--bg);
      }
      a { color: inherit; text-decoration: none; }
      .container { max-width: 1240px; margin: 0 auto; padding: 18px; }
      .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0 20px; }
      .brand { display:flex; align-items:center; gap:14px; }
      .brand-badge { width:46px; height:46px; border-radius:18px; display:grid; place-items:center; background:var(--primary); color:#fff; box-shadow:var(--shadow); font-size:20px; }
      .muted { color: rgba(45,42,50,.62); }
      .small { font-size: 13px; }
      .nav, .actions, .chips { display:flex; gap:10px; flex-wrap:wrap; }
      .btn { border:0; border-radius:18px; padding:12px 16px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; font: inherit; }
      .btn-primary { background:var(--primary); color:#fff; }
      .btn-outline { background:#fff; border:1px solid var(--border); color:var(--fg); }
      .page-shell { min-height: calc(100vh - 90px); }
      .hero { display:grid; grid-template-columns:1.08fr .92fr; gap:22px; align-items:center; padding:16px 0 30px; }
      .card { background: var(--card); border:1px solid rgba(255,255,255,.7); border-radius:28px; box-shadow:var(--shadow); backdrop-filter: blur(14px); }
      .section { padding:22px; }
      .badge, .chip { display:inline-flex; align-items:center; gap:6px; border-radius:999px; font-weight:700; }
      .badge { padding:8px 12px; background:rgba(214,158,46,.15); color:#9a6a08; font-size:13px; }
      .chip { padding:7px 11px; font-size:12px; background:rgba(107,70,193,.10); color:var(--primary); }
      .chip.gold { background:rgba(214,158,46,.14); color:#9a6a08; }
      .chip.dark { background:rgba(45,42,50,.08); color:var(--fg); }
      h1 { font-size: clamp(2.4rem, 4.3vw, 4.7rem); line-height: 1.02; margin: 16px 0; }
      h2 { font-size: clamp(1.45rem, 2.4vw, 2rem); margin: 0 0 10px; }
      h3 { margin:0 0 8px; font-size:1.05rem; }
      p { line-height:1.7; color: rgba(45,42,50,.78); }
      .preview { overflow:hidden; padding:16px; }
      .preview-hero { border-radius:28px; background: linear-gradient(140deg, #6b46c1, #7c57d4 58%, #8b5cf6 100%); color:#fff; padding:20px; }
      .preview p, .preview .muted { color: rgba(255,255,255,.84); }
      .preview-grid, .features, .stats-grid, .dashboard-grid, .list { display:grid; gap:16px; }
      .preview-grid, .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .features { grid-template-columns: repeat(4, minmax(0,1fr)); margin: 18px 0 28px; }
      .dashboard-layout { display:grid; grid-template-columns: 280px minmax(0, 1fr); gap:20px; }
      .sidebar { padding:12px; position:sticky; top:18px; height:fit-content; }
      .sidebar-hero { border-radius:26px; background: linear-gradient(140deg, #6b46c1, #8b5cf6); color:#fff; padding:16px; }
      .sidebar-nav { display:grid; gap:8px; margin-top:16px; }
      .sidebar-link { display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; color: rgba(45,42,50,.78); background:transparent; }
      .sidebar-link.active { background:var(--primary); color:#fff; }
      .sidebar-link:hover { background:var(--muted); }
      .sidebar-foot { margin-top:16px; border-radius:22px; background:var(--muted); padding:14px; }
      .main-col { display:grid; gap:18px; }
      .top-panel { padding:18px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
      .search { width:100%; max-width:280px; border:1px solid #fff; background:var(--muted); border-radius:18px; padding:12px 14px; font:inherit; }
      .stats-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
      .stat-card, .soft-card { padding:20px; }
      .stat-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
      .stat-icon { width:44px; height:44px; border-radius:18px; display:grid; place-items:center; background:rgba(107,70,193,.1); color:var(--primary); font-size:18px; }
      .dashboard-main { display:grid; grid-template-columns: 1.16fr .84fr; gap:18px; }
      .chart-box { min-height:320px; }
      .event-list, .list { display:grid; gap:14px; }
      .soft { background:var(--muted); border-radius:20px; padding:14px; }
      .request-card { padding:20px; }
      .meta { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid rgba(233,220,200,.8); color: rgba(45,42,50,.62); font-size:14px; }
      form { display:grid; gap:14px; }
      label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
      input, textarea, select { width:100%; border:1px solid #fff; background:var(--muted); border-radius:18px; padding:12px 14px; color:var(--fg); font:inherit; }
      textarea { min-height:120px; resize:vertical; }
      .auth-grid { display:grid; grid-template-columns: .95fr 1.05fr; overflow:hidden; }
      .auth-hero { background: linear-gradient(140deg, #6b46c1, #8b5cf6); color:#fff; padding:28px; }
      .auth-hero p, .auth-hero .muted { color: rgba(255,255,255,.82); }
      .auth-list { display:grid; gap:10px; margin-top:24px; }
      .auth-item { display:flex; gap:10px; align-items:center; padding:12px 14px; border-radius:18px; background:rgba(255,255,255,.1); }
      .auth-form-wrap { padding:28px; }
      .split { display:grid; grid-template-columns: 1fr 320px; gap:18px; }
      .empty { padding:18px; background:var(--muted); border-radius:18px; color: rgba(45,42,50,.68); }
      .footer { padding:36px 0 50px; color: rgba(45,42,50,.6); font-size:14px; }
      @media (max-width: 1020px) {
        .hero, .dashboard-layout, .dashboard-main, .split, .auth-grid { grid-template-columns: 1fr; }
        .features { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .sidebar { position: static; }
      }
      @media (max-width: 680px) {
        .features, .preview-grid, .stats-grid { grid-template-columns: 1fr; }
        .topbar, .top-panel { align-items:flex-start; flex-direction:column; }
        .search { max-width: none; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a class="brand" href="#/">
          <div class="brand-badge">🤝</div>
          <div>
            <div style="font-weight:700">PrayerConnect</div>
            <div class="muted small">Gratis gebedsplatform voor kerken</div>
          </div>
        </a>
        <nav class="nav">
          <a class="btn btn-outline" href="#/login">Inloggen</a>
          <a class="btn btn-primary" href="#/register">Start gratis</a>
        </nav>
      </header>
      <main id="app" class="page-shell"></main>
      <footer class="footer">PrayerConnect · GitHub Pages + Supabase · gebouwd voor warme, toegankelijke betrokkenheid</footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://iatehwjwhmhvcujroxka.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdGVod2p3aG1odmN1anJveGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTE3MDMsImV4cCI6MjA5MDYyNzcwM30.QArrIXoD5ekkM0XuqJrGVD4qCAafTurWe33uGPQjTeM';
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const app = document.getElementById('app');
      function esc(value) { return String(value ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
      function slugify(text) { return text.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
      function currentHash() { return location.hash.replace(/^#/, '') || '/'; }
      function wallUrl(slug) { return `${location.origin}${location.pathname}#/kerk/${slug}/gebedsmuur`; }
      function fmtDate(value) { try { return new Date(value).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' }); } catch { return value; } }
      function iconBubble(char) { return `<div class="stat-icon">${char}</div>`; }
      async function getChurchBySlug(slug) { const { data, error } = await supabaseClient.from('churches').select('*').eq('slug', slug).maybeSingle(); if (error) throw error; return data; }
      async function getDashboardRequests(churchId) { const { data, error } = await supabaseClient.from('prayer_request_stats').select('*').eq('church_id', churchId).order('created_at', { ascending: false }); if (error) throw error; return data || []; }
      async function getPublicRequests(churchId) { const { data, error } = await supabaseClient.from('prayer_request_stats').select('*').eq('church_id', churchId).eq('visibility', 'openbaar').eq('approved', true).order('created_at', { ascending: false }); if (error) throw error; return data || []; }
      async function getEvents(churchId) { const { data, error } = await supabaseClient.from('prayer_events').select('*').eq('church_id', churchId).order('event_date', { ascending: true }).limit(5); if (error) throw error; return data || []; }
      async function getDashboardStats(churchId) { const rows = await getDashboardRequests(churchId); return { open: rows.filter((r) => r.status === 'open' || r.status === 'in_gebed').length, people: rows.reduce((sum, r) => sum + (r.prayers_count || 0), 0), answered: rows.filter((r) => r.status === 'beantwoord').length, upcoming: 0 }; }
      async function ensureLeaderChurch() {
        const { data: authData } = await supabaseClient.auth.getUser();
        const user = authData?.user;
        if (!user) return null;
        const { data: member } = await supabaseClient.from('church_members').select('church_id, role').eq('user_id', user.id).order('created_at', { ascending: true }).limit(1).maybeSingle();
        if (member?.church_id) {
          const { data: church } = await supabaseClient.from('churches').select('*').eq('id', member.church_id).maybeSingle();
          if (church) return church;
        }
        const { data: ownedChurch } = await supabaseClient.from('churches').select('*').eq('owner_id', user.id).order('created_at', { ascending: true }).limit(1).maybeSingle();
        if (ownedChurch) {
          await supabaseClient.from('church_members').upsert({ church_id: ownedChurch.id, user_id: user.id, role: 'admin' }, { onConflict: 'church_id,user_id' });
          return ownedChurch;
        }
        const metadata = user.user_metadata || {};
        const churchName = String(metadata.church_name || 'Mijn Kerk').trim();
        const slugBase = slugify(churchName) || 'mijn-kerk';
        const slug = `${slugBase}-${user.id.slice(0, 8)}`;
        const { data: createdChurch, error: churchError } = await supabaseClient.from('churches').insert({ name: churchName, slug, location: String(metadata.location || ''), denomination: String(metadata.denomination || ''), primary_color: '#6B46C1', owner_id: user.id, approval_required: true }).select('*').single();
        if (churchError) throw churchError;
        const { error: memberError } = await supabaseClient.from('church_members').insert({ church_id: createdChurch.id, user_id: user.id, role: 'admin' });
        if (memberError && !String(memberError.message || '').toLowerCase().includes('duplicate')) throw memberError;
        return createdChurch;
      }
      function requestCard(request, admin = false) { return `<div class="card request-card"><div class="chips"><span class="chip">${esc(request.category || 'algemeen')}</span><span class="chip gold">${esc(request.priority || 'normaal')}</span>${request.visibility === 'prive' ? '<span class="chip dark">privé</span>' : ''}${request.status ? `<span class="chip dark">${esc(request.status.replace('_', ' '))}</span>` : ''}</div><h3 style="margin-top:14px;font-size:1.2rem;">${esc(request.title)}</h3><p>${esc(request.description)}</p><div class="meta"><div>${esc(request.author_name || 'Anoniem')} · ${fmtDate(request.created_at)}</div><div>🙏 ${request.prayers_count || 0} · 💬 ${request.comments_count || 0}</div></div><div class="actions" style="margin-top:16px;">${request.visibility === 'openbaar' ? `<button class="btn btn-primary" data-pray="${request.id}">Ik bid mee</button>` : ''}${admin ? `<button class="btn btn-outline" data-approve="${request.id}">Goedkeuren</button><button class="btn btn-outline" data-answer="${request.id}">Beantwoord</button>` : '<button class="btn btn-outline">Details</button>'}</div></div>`; }
      function homeView() { return `<section class="hero"><div><span class="badge">Volledig gratis voor kerken</span><h1>Breng je gemeente samen in gebed</h1><p>PrayerConnect helpt kerken om gebedsverzoeken warm, eenvoudig en mobielvriendelijk te delen — zonder gedoe en zonder stroperige beheerschermen.</p><div class="actions" style="margin-top:18px;"><a class="btn btn-primary" href="#/register">Start gratis</a><a class="btn btn-outline" href="#/kerk/test-c1a13230/gebedsmuur">Bekijk demo gebedsmuur</a></div></div><div class="card preview"><div class="preview-hero"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><div><div class="small">Hoopvolle Gemeente</div><div style="margin-top:6px;font-size:1.7rem;font-weight:700;">Live dashboard preview</div></div><span class="chip" style="background:rgba(255,255,255,.14);color:#fff;">Mobiel eerst</span></div><div class="preview-grid" style="margin-top:18px;"><div class="soft" style="background:rgba(255,255,255,.14);color:#fff;"><div class="small">Open verzoeken</div><div style="font-size:2rem;font-weight:800;margin-top:6px;">24</div><div class="small">+3 deze week</div></div><div class="soft" style="background:rgba(255,255,255,.14);color:#fff;"><div class="small">Mensen bidden mee</div><div style="font-size:2rem;font-weight:800;margin-top:6px;">138</div><div class="small">Actief in de gemeente</div></div></div></div><div class="preview-grid" style="margin-top:14px;"><div class="soft"><div class="small muted">Komend gebedsmoment</div><div style="font-size:1.1rem;font-weight:700;margin-top:6px;">Vrijdag 19:30</div></div><div class="soft"><div class="small muted">Snelle actie</div><div style="font-size:1.1rem;font-weight:700;margin-top:6px;">Ga direct naar dashboard</div></div></div></div></section><section class="features"><div class="card section"><h3>Openbare gebedsmuur</h3><p>Iedereen kan verzoeken lezen, meebidden en zelf iets insturen.</p></div><div class="card section"><h3>Leidersdashboard</h3><p>Beheer verzoeken, team en instellingen op één rustige plek.</p></div><div class="card section"><h3>Delen met link</h3><p>Elke kerk krijgt een eigen deelbare muur-link.</p></div><div class="card section"><h3>Mobiel-first</h3><p>Gebouwd voor snel gebruik op telefoon en tablet.</p></div></section>`; }
      function authView(mode) { const register = mode === 'register'; return `<section class="card auth-grid"><div class="auth-hero"><div class="chip" style="background:rgba(255,255,255,.12);color:#fff;">PrayerConnect</div><h2 style="margin-top:18px;font-size:2rem;">${register ? 'Zet je kerk direct live' : 'Welkom terug in je dashboard'}</h2><p>${register ? 'Maak je account aan en ga daarna meteen naar een werkend dashboard.' : 'Log in en ga direct verder met verzoeken, teamleden en planning.'}</p><div class="auth-list"><div class="auth-item">✅ Direct naar een bruikbaar leidersdashboard</div><div class="auth-item">✅ Mobielvriendelijke gebedsmuur</div><div class="auth-item">✅ Geen kapotte setup-tussenpagina</div></div></div><div class="auth-form-wrap"><form id="${register ? 'register-form' : 'login-form'}">${register ? `<div><label>Jouw naam</label><input name="name" required /></div><div><label>Naam van je kerk</label><input name="church_name" required /></div><div><label>Locatie</label><input name="location" /></div><div><label>Denominatie</label><input name="denomination" /></div>` : ''}<div><label>E-mailadres</label><input type="email" name="email" required /></div><div><label>Wachtwoord</label><input type="password" name="password" minlength="6" required /></div><button class="btn btn-primary" type="submit">${register ? 'Ga naar dashboard' : 'Open dashboard'}</button><div id="${register ? 'register-message' : 'login-message'}" class="small muted"></div></form></div></section>`; }
      function wallView(church, requests) { const url = wallUrl(church.slug); return `<section class="split"><div><div class="card section"><span class="badge">${esc(church.name)}</span><h2 style="margin-top:14px;">Gebedsmuur</h2><p>Deel een gebedsverzoek, bid mee met anderen en blijf als gemeente betrokken.</p><div class="actions" style="margin-top:14px;"><a class="btn btn-outline" href="#/kerk/${encodeURIComponent(church.slug)}/delen">Deel deze muur</a><a class="btn btn-primary" href="${url}" target="_blank" rel="noreferrer">Open directe link</a></div></div><div class="list" style="margin-top:16px;">${requests.length ? requests.map((r) => requestCard(r)).join('') : '<div class="empty">Nog geen openbare gebedsverzoeken.</div>'}</div></div><aside class="card section"><h3>Plaats een gebedsverzoek</h3><p>Je kunt met naam of anoniem posten.</p><form id="public-request-form"><input type="hidden" name="church_id" value="${esc(church.id)}" /><div><label>Naam (optioneel)</label><input name="author_name" /></div><div><label>Titel</label><input name="title" required /></div><div><label>Beschrijving</label><textarea name="description" required></textarea></div><div><label>Categorie</label><select name="category"><option value="algemeen">algemeen</option><option value="ziekte">ziekte</option><option value="familie">familie</option><option value="werk">werk</option><option value="geestelijk_leven">geestelijk leven</option></select></div><div><label>Prioriteit</label><select name="priority"><option value="normaal">normaal</option><option value="urgent">urgent</option><option value="laag">laag</option></select></div><button class="btn btn-primary" type="submit">Verzoek delen</button><div id="public-request-message" class="small muted"></div></form></aside></section>`; }
      function shareView(church) { const url = wallUrl(church.slug); return `<section class="card section"><h2>Deel je gebedsmuur</h2><p>Gebruik deze link in je nieuwsbrief, WhatsAppgroep of website.</p><div style="margin-top:14px;"><label>Directe link</label><input value="${esc(url)}" readonly /></div><div style="margin-top:14px;"><label>Embed code</label><textarea readonly>&lt;iframe src="${esc(url)}" width="100%" height="760" style="border:none;border-radius:24px;"&gt;&lt;/iframe&gt;</textarea></div></section>`; }
      function sidebar(route) { const items = [['/dashboard', 'Dashboard'], ['/dashboard/verzoeken', 'Verzoeken'], ['/dashboard/nieuw', 'Nieuw verzoek'], ['/dashboard/team', 'Team'], ['/dashboard/instellingen', 'Instellingen']]; return `<aside class="card sidebar"><div class="sidebar-hero"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><div><div style="font-weight:700;">PrayerConnect</div><div class="small" style="color:rgba(255,255,255,.75)">Leidersdashboard</div></div><div>✨</div></div><div style="margin-top:14px;border-radius:20px;padding:12px;background:rgba(255,255,255,.12);"><div class="small" style="color:rgba(255,255,255,.7)">Actief</div><div style="margin-top:6px;font-weight:700;">Hoopvolle Gemeente</div></div></div><div class="sidebar-nav">${items.map(([href, label]) => `<a class="sidebar-link ${route === href ? 'active' : ''}" href="#${href}"><span style="width:34px;height:34px;border-radius:14px;display:grid;place-items:center;background:${route === href ? 'rgba(255,255,255,.14)' : 'rgba(45,42,50,.05)'};">•</span><span>${label}</span></a>`).join('')}</div><div class="sidebar-foot"><div style="font-weight:700;">Deze week</div><div class="small muted" style="margin-top:6px;">Open verzoeken, activiteit en teambeheer in één overzicht.</div></div></aside>`; }
      function dashboardShell(route, inner) { return `<section class="dashboard-layout">${sidebar(route)}<div class="main-col"><div class="card top-panel"><div><div class="small" style="text-transform:uppercase;letter-spacing:.2em;color:rgba(107,70,193,.75);font-weight:700;">PrayerConnect dashboard</div><div style="font-size:1.8rem;font-weight:700;margin-top:6px;">Welkom terug 👋</div><div class="small muted" style="margin-top:6px;">Hier zie je in één oogopslag wat aandacht vraagt in jullie gemeente.</div></div><div class="actions" style="width:100%;justify-content:flex-end;"><input class="search" placeholder="Zoek verzoek of teamlid" /><button class="btn btn-outline" id="logout-btn">Uitloggen</button></div></div>${inner}</div></section>`; }
      function dashboardView(church, stats, requests, events) { return dashboardShell('/dashboard', `<div class="stats-grid"><div class="card stat-card"><div class="stat-row"><div><div class="muted small">Open verzoeken</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">${stats.open}</div></div>${iconBubble('🙏')}</div><div class="small" style="color:var(--primary);margin-top:14px;">Actuele aandachtspunten</div></div><div class="card stat-card"><div class="stat-row"><div><div class="muted small">Mensen bidden mee</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">${stats.people}</div></div>${iconBubble('👥')}</div><div class="small" style="color:var(--primary);margin-top:14px;">Totaal engagement</div></div><div class="card stat-card"><div class="stat-row"><div><div class="muted small">Beantwoorde gebeden</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">${stats.answered}</div></div>${iconBubble('💬')}</div><div class="small" style="color:var(--primary);margin-top:14px;">Mooi om te delen</div></div><div class="card stat-card"><div class="stat-row"><div><div class="muted small">Komende events</div><div style="font-size:2rem;font-weight:800;margin-top:8px;">${events.length}</div></div>${iconBubble('🗓')}</div><div class="small" style="color:var(--primary);margin-top:14px;">Binnenkort gepland</div></div></div><div class="dashboard-main"><div class="card soft-card chart-box"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><div><h3 style="font-size:1.15rem;">Betrokkenheid deze week</h3><div class="small muted">Compact overzicht van activiteit en open verzoeken.</div></div><span class="chip">Live overzicht</span></div><div style="margin-top:20px;display:grid;gap:12px;">${['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'].map((day, i) => `<div style="display:grid;grid-template-columns:36px 1fr 32px;align-items:center;gap:10px;"><div class="small muted">${day}</div><div style="height:12px;border-radius:999px;background:rgba(107,70,193,.10);overflow:hidden;"><div style="height:100%;width:${[36,52,48,68,60,28,82][i]}%;background:linear-gradient(90deg,#6b46c1,#8b5cf6);border-radius:999px;"></div></div><div class="small muted">${[12,18,17,24,22,10,31][i]}</div></div>`).join('')}</div></div><div class="list"><div class="card soft-card"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><div><h3 style="font-size:1.15rem;">Komende momenten</h3><div class="small muted">Planning en gebedsmomenten</div></div><span class="chip gold">Planning</span></div><div class="event-list" style="margin-top:16px;">${events.length ? events.map((event) => `<div class="soft"><div style="font-weight:700;">${esc(event.title)}</div><div class="small muted" style="margin-top:6px;">${fmtDate(event.event_date)}</div></div>`).join('') : '<div class="empty">Nog geen events gepland.</div>'}</div></div>${requests.slice(0, 2).map((r) => requestCard(r)).join('') || '<div class="empty">Nog geen verzoeken gevonden.</div>'}</div></div>`); }
      function requestsView(requests) { return dashboardShell('/dashboard/verzoeken', `<div class="card section"><h2>Gebedsverzoeken</h2><p>Filter op urgentie, zoek op naam of onderwerp en houd overzicht over alle verzoeken.</p><div class="split" style="grid-template-columns:1fr 180px 180px;margin-top:16px;"><input placeholder="Zoek op titel, naam of categorie" /><input placeholder="Filter op status" /><input placeholder="Filter op zichtbaarheid" /></div></div><div class="list">${requests.length ? requests.map((r) => requestCard(r, true)).join('') : '<div class="empty">Nog geen verzoeken gevonden.</div>'}</div>`); }
      function newRequestView() { return dashboardShell('/dashboard/nieuw', `<div class="card section"><h2>Nieuw gebedsverzoek</h2><p>Voeg als leider een verzoek toe namens jezelf, een gemeentelid of het gebedsteam.</p><form id="leader-request-form" style="margin-top:16px;"><div><label>Titel</label><input name="title" required /></div><div><label>Categorie</label><select name="category"><option value="algemeen">algemeen</option><option value="ziekte">ziekte</option><option value="familie">familie</option><option value="werk">werk</option><option value="geestelijk_leven">geestelijk leven</option></select></div><div><label>Prioriteit</label><select name="priority"><option value="normaal">normaal</option><option value="urgent">urgent</option><option value="laag">laag</option></select></div><div><label>Beschrijving</label><textarea name="description" required></textarea></div><div><label>Zichtbaarheid</label><select name="visibility"><option value="openbaar">openbaar</option><option value="prive">prive</option></select></div><div><label>Auteur</label><input name="author_name" /></div><button class="btn btn-primary" type="submit">Verzoek opslaan</button><div id="leader-request-message" class="small muted"></div></form></div>`); }
      function teamView() { return dashboardShell('/dashboard/team', `<div class="card section"><h2>Team en rollen</h2><p>Nodig leiders uit, beheer rollen en houd zicht op wie toegang heeft.</p><div class="list" style="margin-top:16px;"><div class="soft"><div style="font-weight:700;">Sara de Vries</div><div class="small muted">admin · sara@kerk.nl</div></div><div class="soft"><div style="font-weight:700;">Joel van Dam</div><div class="small muted">coordinator · joel@kerk.nl</div></div><div class="soft"><div style="font-weight:700;">Mila Bos</div><div class="small muted">member · mila@kerk.nl</div></div></div></div>`); }
      function settingsView(church) { return dashboardShell('/dashboard/instellingen', `<div class="card section"><h2>Instellingen</h2><p>Beheer kerkgegevens, branding, auto-archivering en meldingen.</p><form style="margin-top:16px;"><div><label>Kerknaam</label><input value="${esc(church.name)}" /></div><div><label>Slug</label><input value="${esc(church.slug)}" /></div><div><label>Locatie</label><input value="${esc(church.location || '')}" /></div><div><label>Denominatie</label><input value="${esc(church.denomination || '')}" /></div><div><label>Primaire kleur</label><input value="${esc(church.primary_color || '#6B46C1')}" /></div><button class="btn btn-primary" type="button">Instellingen opslaan</button></form></div>`); }
      function bindLogin() { const form = document.getElementById('login-form'); const msg = document.getElementById('login-message'); form?.addEventListener('submit', async (e) => { e.preventDefault(); msg.textContent = 'Bezig met inloggen...'; const fd = new FormData(form); const { error } = await supabaseClient.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') }); if (error) { msg.textContent = error.message; return; } location.hash = '#/dashboard'; }); }
      function bindRegister() { const form = document.getElementById('register-form'); const msg = document.getElementById('register-message'); form?.addEventListener('submit', async (e) => { e.preventDefault(); msg.textContent = 'Account en kerk worden aangemaakt...'; const fd = new FormData(form); const { error, data } = await supabaseClient.auth.signUp({ email: String(fd.get('email') || ''), password: String(fd.get('password') || ''), options: { data: { full_name: String(fd.get('name') || ''), church_name: String(fd.get('church_name') || ''), location: String(fd.get('location') || ''), denomination: String(fd.get('denomination') || '') } } }); if (error) { msg.textContent = error.message; return; } if (data?.session) { await ensureLeaderChurch(); location.hash = '#/dashboard'; return; } msg.textContent = 'Registratie gelukt. Log nu in om direct naar je dashboard te gaan.'; setTimeout(() => { location.hash = '#/login'; }, 1000); }); }
      function bindPublicRequestForm(churchId) { const form = document.getElementById('public-request-form'); const msg = document.getElementById('public-request-message'); form?.addEventListener('submit', async (e) => { e.preventDefault(); msg.textContent = 'Verzoek wordt verzonden...'; const fd = new FormData(form); const { error } = await supabaseClient.from('prayer_requests').insert({ church_id: churchId, author_name: String(fd.get('author_name') || '').trim() || 'Anoniem', title: String(fd.get('title') || '').trim(), description: String(fd.get('description') || '').trim(), category: String(fd.get('category') || 'algemeen'), priority: String(fd.get('priority') || 'normaal'), visibility: 'openbaar', status: 'open', approved: false }); if (error) { msg.textContent = error.message; return; } form.reset(); msg.textContent = 'Dankjewel. Je verzoek is ontvangen en verschijnt na goedkeuring.'; }); }
      function bindLeaderRequestForm(churchId) { const form = document.getElementById('leader-request-form'); const msg = document.getElementById('leader-request-message'); form?.addEventListener('submit', async (e) => { e.preventDefault(); msg.textContent = 'Opslaan...'; const fd = new FormData(form); const { error } = await supabaseClient.from('prayer_requests').insert({ church_id: churchId, author_name: String(fd.get('author_name') || '').trim() || 'Leiderschap', title: String(fd.get('title') || '').trim(), description: String(fd.get('description') || '').trim(), category: String(fd.get('category') || 'algemeen'), priority: String(fd.get('priority') || 'normaal'), visibility: String(fd.get('visibility') || 'openbaar'), status: 'open', approved: true }); if (error) { msg.textContent = error.message; return; } msg.textContent = 'Verzoek opgeslagen.'; setTimeout(() => { location.hash = '#/dashboard/verzoeken'; }, 500); }); }
      function bindDashboardActions() { document.getElementById('logout-btn')?.addEventListener('click', async () => { await supabaseClient.auth.signOut(); location.hash = '#/'; }); document.querySelectorAll('[data-approve]').forEach((button) => { button.addEventListener('click', async () => { const id = button.getAttribute('data-approve'); const { error } = await supabaseClient.from('prayer_requests').update({ approved: true }).eq('id', id); if (error) return alert(error.message); render(); }); }); document.querySelectorAll('[data-answer]').forEach((button) => { button.addEventListener('click', async () => { const id = button.getAttribute('data-answer'); const { error } = await supabaseClient.from('prayer_requests').update({ status: 'beantwoord' }).eq('id', id); if (error) return alert(error.message); render(); }); }); document.querySelectorAll('[data-pray]').forEach((button) => { button.addEventListener('click', async () => { const requestId = button.getAttribute('data-pray'); const { data: authData } = await supabaseClient.auth.getUser(); const user = authData?.user; if (!user) { alert('Log eerst in om “Ik bid mee” te gebruiken.'); location.hash = '#/login'; return; } const { error } = await supabaseClient.from('prayer_engagements').insert({ request_id: requestId, user_id: user.id }); if (error) { alert(String(error.message || '').includes('duplicate') ? 'Je bidt al mee met dit verzoek.' : error.message); return; } alert('Dankjewel — je bidt mee.'); render(); }); }); }
      async function render() { const route = currentHash(); try { if (route === '/' || route === '') { app.innerHTML = homeView(); return; } if (route === '/login') { app.innerHTML = authView('login'); bindLogin(); return; } if (route === '/register') { app.innerHTML = authView('register'); bindRegister(); return; } if (route.startsWith('/kerk/')) { const match = route.match(/^\/kerk\/([^/]+)\/(gebedsmuur|delen)$/); if (!match) { app.innerHTML = '<section class="card section"><h2>Pagina niet gevonden</h2></section>'; return; } const slug = decodeURIComponent(match[1]); const page = match[2]; const church = await getChurchBySlug(slug); if (!church) { app.innerHTML = '<section class="card section"><h2>Kerk niet gevonden</h2><p>Controleer de link of maak eerst een kerk aan.</p></section>'; return; } if (page === 'delen') { app.innerHTML = shareView(church); return; } const requests = await getPublicRequests(church.id); app.innerHTML = wallView(church, requests); bindPublicRequestForm(church.id); bindDashboardActions(); return; } if (route.startsWith('/dashboard')) { const { data: authData } = await supabaseClient.auth.getSession(); if (!authData?.session) { location.hash = '#/login'; return; } const church = await ensureLeaderChurch(); if (!church) { app.innerHTML = '<section class="card section"><h2>Dashboard wordt klaargezet</h2><p>Je account bestaat, maar er ging iets mis bij het koppelen van je kerk. Probeer opnieuw in te loggen of registreer je kerk opnieuw.</p></section>'; return; } const requests = await getDashboardRequests(church.id); const stats = await getDashboardStats(church.id); const events = await getEvents(church.id); stats.upcoming = events.length; if (route === '/dashboard/nieuw') { app.innerHTML = newRequestView(); bindLeaderRequestForm(church.id); bindDashboardActions(); return; } if (route === '/dashboard/verzoeken') { app.innerHTML = requestsView(requests); bindDashboardActions(); return; } if (route === '/dashboard/team') { app.innerHTML = teamView(); bindDashboardActions(); return; } if (route === '/dashboard/instellingen') { app.innerHTML = settingsView(church); bindDashboardActions(); return; } app.innerHTML = dashboardView(church, stats, requests, events); bindDashboardActions(); return; } app.innerHTML = '<section class="card section"><h2>Pagina niet gevonden</h2></section>'; } catch (error) { console.error(error); app.innerHTML = `<section class="card section"><h2>Er ging iets mis</h2><p>${esc(error?.message || 'Onbekende fout')}</p></section>`; } }
      window.addEventListener('hashchange', render);
      supabaseClient.auth.onAuthStateChange(() => { if (currentHash().startsWith('/dashboard') || currentHash() === '/login') render(); });
      render();
    </script>
  </body>
</html>
