<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrayerConnect</title>
    <meta name="description" content="PrayerConnect — gratis gebedsplatform voor kerken" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #FFFBF5;
        --fg: #2D2A32;
        --muted: #F6EFE6;
        --border: #E9DCC8;
        --primary: #6B46C1;
        --gold: #D69E2E;
        --blue: #63B3ED;
        --card: #FFFFFF;
        --shadow: 0 12px 40px rgba(107, 70, 193, 0.10);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: radial-gradient(circle at top, rgba(107,70,193,.15), transparent 35%), var(--bg);
        color: var(--fg);
      }
      a { color: inherit; }
      .container { max-width: 1180px; margin: 0 auto; padding: 20px; }
      .hidden { display: none !important; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0;
      }
      .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; text-decoration: none; }
      .brand-badge {
        width: 46px; height: 46px; border-radius: 18px; background: var(--primary); color: white; display: grid; place-items: center; box-shadow: var(--shadow); font-size: 20px;
      }
      .nav { display: flex; gap: 10px; flex-wrap: wrap; }
      .btn {
        border: 0; border-radius: 18px; padding: 12px 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn-primary { background: var(--primary); color: white; }
      .btn-outline { background: white; border: 1px solid var(--border); color: var(--fg); }
      .btn-gold { background: var(--gold); color: white; }
      .hero {
        display: grid; gap: 20px; grid-template-columns: 1.15fr .85fr; padding: 22px 0 30px;
      }
      .card {
        background: var(--card); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); padding: 22px;
      }
      .badge {
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: rgba(214,158,46,.14); color: #9a6a08; font-size: 13px; font-weight: 700;
      }
      h1 { font-size: clamp(2.2rem, 4.2vw, 4.6rem); line-height: 1.02; margin: 16px 0; }
      h2 { font-size: clamp(1.35rem, 2.5vw, 2rem); margin: 0 0 10px; }
      h3 { margin: 0 0 8px; font-size: 1.05rem; }
      p { color: rgba(45,42,50,.78); line-height: 1.7; }
      .muted { color: rgba(45,42,50,.62); }
      .stats, .features, .requests-grid, .dashboard-grid { display: grid; gap: 16px; }
      .stats { grid-template-columns: repeat(3, 1fr); margin-top: 20px; }
      .features { grid-template-columns: repeat(4, 1fr); margin: 18px 0 28px; }
      .requests-grid { grid-template-columns: 1fr 360px; align-items: start; }
      .dashboard-grid { grid-template-columns: repeat(4, 1fr); }
      .stat-number { font-size: 2rem; font-weight: 800; margin-top: 8px; }
      .preview {
        background: linear-gradient(140deg, #6B46C1, #8157d8 60%, #63B3ED 130%); color: white;
      }
      .preview p, .preview .muted { color: rgba(255,255,255,.9); }
      .request-card { padding: 18px; border-radius: 22px; background: white; border: 1px solid var(--border); box-shadow: var(--shadow); }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .chip { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(107,70,193,.1); color: var(--primary); }
      .chip.gold { background: rgba(214,158,46,.14); color: #9a6a08; }
      .chip.dark { background: rgba(45,42,50,.08); color: var(--fg); }
      .meta { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; color: rgba(45,42,50,.62); font-size: 14px; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
      form { display: grid; gap: 12px; }
      input, textarea, select {
        width: 100%; border: 1px solid var(--border); background: white; border-radius: 18px; padding: 12px 14px; font: inherit; color: var(--fg);
      }
      textarea { min-height: 120px; resize: vertical; }
      label { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: block; }
      .section-title { margin: 12px 0 18px; }
      .subnav { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
      .panel { margin-top: 14px; }
      .list { display: grid; gap: 14px; }
      .empty { padding: 18px; background: var(--muted); border-radius: 18px; color: rgba(45,42,50,.68); }
      .footer { padding: 36px 0 50px; color: rgba(45,42,50,.6); font-size: 14px; }
      .small { font-size: 13px; }
      .link { color: var(--primary); text-decoration: none; font-weight: 600; }
      .notice { background: rgba(99,179,237,.16); color: #184b73; border-radius: 18px; padding: 14px; font-size: 14px; }
      .success { background: rgba(34,197,94,.12); color: #17603a; border-radius: 18px; padding: 14px; font-size: 14px; }
      @media (max-width: 980px) {
        .hero, .requests-grid { grid-template-columns: 1fr; }
        .features { grid-template-columns: repeat(2, 1fr); }
        .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
        .stats { grid-template-columns: 1fr; }
      }
      @media (max-width: 640px) {
        .features, .dashboard-grid { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>

        <a class="brand" href="#/">
          <div class="brand-badge">🤝</div>

        <nav class="nav">

          <a class="btn btn-primary" href="#/register">Start gratis</a>
        </nav>
      </header>

      <main id="app"></main>

      <footer class="footer">
        PrayerConnect · GitHub Pages + Supabase · gebouwd voor warme, toegankelijke betrokkenheid
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://iatehwjwhmhvcujroxka.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdGVod2p3aG1odmN1anJveGthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTE3MDMsImV4cCI6MjA5MDYyNzcwM30.QArrIXoD5ekkM0XuqJrGVD4qCAafTurWe33uGPQjTeM';
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const app = document.getElementById('app');

      const state = {
        church: null,
        requests: [],
        stats: null,
        session: null,
        loading: false,
      };

      function slugify(text) {
        return text.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      function formatDate(value) {
        try { return new Date(value).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' }); }
        catch { return value; }
      }

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
      }

      function currentHash() {
        return location.hash.replace(/^#/, '') || '/';
      }

      function churchWallUrl(slug) {
        return `${location.origin}${location.pathname}#/kerk/${slug}/gebedsmuur`;
      }

      async function getChurchBySlug(slug) {
        const { data, error } = await supabaseClient.from('churches').select('*').eq('slug', slug).maybeSingle();
        if (error) throw error;
        return data;
      }

      async function getPublicRequests(churchId) {
        const { data, error } = await supabaseClient
          .from('prayer_request_stats')
          .select('*')
          .eq('church_id', churchId)
          .eq('visibility', 'openbaar')
          .eq('approved', true)
          .order('created_at', { ascending: false });
        if (error) throw error;
        return data || [];
      }

      async function getDashboardStats(churchId) {
        const { data: requests, error } = await supabaseClient
          .from('prayer_request_stats')
          .select('*')
          .eq('church_id', churchId)
          .order('created_at', { ascending: false });
        if (error) throw error;
        const all = requests || [];
        return {
          open: all.filter(r => r.status === 'open' || r.status === 'in_gebed').length,
          answered: all.filter(r => r.status === 'beantwoord').length,
          publicCount: all.filter(r => r.visibility === 'openbaar').length,
          totalPrayers: all.reduce((sum, r) => sum + (r.prayers_count || 0), 0),
        };
      }

      async function ensureLeaderChurch() {
        const { data: authData } = await supabaseClient.auth.getUser();
        const user = authData?.user;
        if (!user) return null;

        let { data: membership } = await supabaseClient
          .from('church_members')
          .select('church_id, role')
          .eq('user_id', user.id)
          .order('created_at', { ascending: true })
          .limit(1)
          .maybeSingle();

        if (!membership) return null;
        const { data: church } = await supabaseClient.from('churches').select('*').eq('id', membership.church_id).maybeSingle();
        return church;
      }

            <div class="meta">
              <div>${esc(request.author_name || 'Anoniem')} · ${formatDate(request.created_at)}</div>

            <div class="actions">

                <div class="card" style="box-shadow:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.16)"><strong>Multi-tenant</strong><p class="muted">per kerk gescheiden</p></div>

              </div>
            </div>

          <section class="features">

        return `

      function wallView(church, requests) {
        const shareUrl = churchWallUrl(church.slug);
        return `
          <section class="requests-grid">
            <div>
              <div class="card">
                <span class="badge">${esc(church.name)}</span>
                <h2 class="section-title">Gebedsmuur</h2>
                <p>Deel een gebedsverzoek, bid mee met anderen en blijf als gemeente betrokken.</p>

      function shareView(church) {

      function dashboardView(church, stats, requests) {
        return `

            <div class="card">

      async function render() {
        const route = currentHash();
        try {
          if (route === '/' || route === '') {
            app.innerHTML = homeView();
            return bindGlobalActions();
          }

          if (route === '/login') {
            app.innerHTML = loginView();
            return bindLogin();
          }

          if (route === '/register') {
            app.innerHTML = registerView();
            return bindRegister();
          }

          if (route.startsWith('/kerk/')) {
            const match = route.match(/^\/kerk\/([^/]+)\/(gebedsmuur|delen)$/);
            if (!match) {
              app.innerHTML = '<section class="card"><h2>Pagina niet gevonden</h2></section>';
              return;
            }
            const slug = decodeURIComponent(match[1]);
            const page = match[2];
            let church = await getChurchBySlug(slug);
            if (!church && slug === 'demo-gemeente') {
              app.innerHTML = '<section class="card"><h2>Demo kerk bestaat nog niet</h2><p>Maak eerst een kerkaccount aan via registreren.</p></section>';
              return;
            }
            if (!church) {
              app.innerHTML = '<section class="card"><h2>Kerk niet gevonden</h2><p>Controleer de link of maak eerst een kerk aan.</p></section>';
              return;
            }
            if (page === 'delen') {
              app.innerHTML = shareView(church);
              return;
            }
            const requests = await getPublicRequests(church.id);
            app.innerHTML = wallView(church, requests);
            bindPublicRequestForm(church.id);
            bindPrayButtons();
            return;
          }

          if (route.startsWith('/dashboard')) {
            const { data: authData } = await supabaseClient.auth.getSession();
            state.session = authData?.session || null;
            if (!state.session) {
              location.hash = '#/login';
              return;
            }
            const church = await ensureLeaderChurch();
            if (!church) {
              app.innerHTML = '<section class="card"><h2>Geen kerk gevonden</h2><p>Je account is nog niet gekoppeld aan een kerk. Registreer opnieuw of voeg handmatig een membership toe in Supabase.</p></section>';
              return;
            }
            const stats = await getDashboardStats(church.id);
            const { data: requests, error } = await supabaseClient.from('prayer_request_stats').select('*').eq('church_id', church.id).order('created_at', { ascending: false });
            if (error) throw error;

            if (route === '/dashboard/nieuw') {
              app.innerHTML = newRequestView();
              bindLeaderRequestForm(church.id);
              return;
            }

            app.innerHTML = dashboardView(church, stats, requests || []);
            bindDashboardActions(church.id);
            return;
          }

          app.innerHTML = '<section class="card"><h2>Pagina niet gevonden</h2></section>';
        } catch (error) {
          console.error(error);
          app.innerHTML = `<section class="card"><h2>Er ging iets mis</h2><p>${esc(error.message || 'Onbekende fout')}</p></section>`;
        }
      }

      function bindGlobalActions() {}

      function bindLogin() {
        const form = document.getElementById('login-form');
        const msg = document.getElementById('login-message');
        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.textContent = 'Bezig met inloggen...';
          const fd = new FormData(form);
          const email = fd.get('email');
          const password = fd.get('password');
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            msg.textContent = error.message;
            return;
          }
          msg.textContent = 'Ingelogd. Doorsturen...';
          location.hash = '#/dashboard';
        });
      }

      function bindRegister() {
        const form = document.getElementById('register-form');
        const msg = document.getElementById('register-message');
        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.textContent = 'Account wordt aangemaakt...';
          const fd = new FormData(form);
          const name = String(fd.get('name') || '');
          const churchName = String(fd.get('church_name') || '');
          const email = String(fd.get('email') || '');
          const password = String(fd.get('password') || '');
          const locationValue = String(fd.get('location') || '');
          const denomination = String(fd.get('denomination') || '');
          const slug = slugify(churchName);

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
          });
          if (error) {
            msg.textContent = error.message;
            return;
          }
          const userId = data?.user?.id;
          if (!userId) {
            msg.textContent = 'Registratie gelukt, maar gebruiker is nog niet direct beschikbaar. Bevestig eventueel je e-mail en log daarna in.';
            return;
          }

          const { error: churchError } = await supabaseClient.from('churches').insert({
            name: churchName,
            slug,
            location: locationValue,
            denomination,
            owner_id: userId,
            approval_required: true,
            auto_archive_days: 90,
            primary_color: '#6B46C1'
          });
          if (churchError) {
            msg.textContent = 'Account gemaakt, maar kerk aanmaken mislukte: ' + churchError.message;
            return;
          }

          const { data: church } = await supabaseClient.from('churches').select('id, slug').eq('owner_id', userId).order('created_at', { ascending: false }).limit(1).single();
          if (church?.id) {
            const { error: memberError } = await supabaseClient.from('church_members').insert({ church_id: church.id, user_id: userId, role: 'admin' });
            if (memberError) {
              msg.textContent = 'Kerk gemaakt, maar teamkoppeling mislukte: ' + memberError.message;
              return;
            }
          }

          msg.innerHTML = `Klaar. Je kerk is aangemaakt. <a class="link" href="#/kerk/${slug}/gebedsmuur">Open je gebedsmuur</a> of ga naar <a class="link" href="#/dashboard">dashboard</a>.`;
        });
      }

      function bindPublicRequestForm(churchId) {
        const form = document.getElementById('public-request-form');
        const msg = document.getElementById('public-request-message');
        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.textContent = 'Verzoek wordt verzonden...';
          const fd = new FormData(form);
          const payload = {
            church_id: churchId,
            author_name: String(fd.get('author_name') || '').trim() || 'Anoniem',
            title: String(fd.get('title') || '').trim(),
            description: String(fd.get('description') || '').trim(),
            category: String(fd.get('category') || 'algemeen'),
            priority: String(fd.get('priority') || 'normaal'),
            visibility: 'openbaar',
            status: 'open',
            approved: false,
          };
          const { error } = await supabaseClient.from('prayer_requests').insert(payload);
          if (error) {
            msg.textContent = error.message;
            return;
          }
          form.reset();
          msg.textContent = 'Dankjewel. Je verzoek is ontvangen en verschijnt na goedkeuring.';
        });
      }

      function bindLeaderRequestForm(churchId) {
        const form = document.getElementById('leader-request-form');
        const msg = document.getElementById('leader-request-message');
        form?.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.textContent = 'Opslaan...';
          const fd = new FormData(form);
          const payload = {
            church_id: churchId,
            author_name: String(fd.get('author_name') || '').trim() || 'Leiderschap',
            title: String(fd.get('title') || '').trim(),
            description: String(fd.get('description') || '').trim(),
            category: String(fd.get('category') || 'algemeen'),
            priority: String(fd.get('priority') || 'normaal'),
            visibility: String(fd.get('visibility') || 'openbaar'),
            status: 'open',
            approved: true,
          };
          const { error } = await supabaseClient.from('prayer_requests').insert(payload);
          if (error) {
            msg.textContent = error.message;
            return;
          }
          msg.textContent = 'Verzoek opgeslagen.';
          setTimeout(() => location.hash = '#/dashboard/verzoeken', 500);
        });
      }

      function bindPrayButtons() {
        document.querySelectorAll('[data-pray]').forEach((button) => {
          button.addEventListener('click', async () => {
            const requestId = button.getAttribute('data-pray');
            const { data: authData } = await supabaseClient.auth.getUser();
            const user = authData?.user;
            if (!user) {
              alert('Log eerst in om “Ik bid mee” te gebruiken.');
              location.hash = '#/login';
              return;
            }
            const { error } = await supabaseClient.from('prayer_engagements').insert({ request_id: requestId, user_id: user.id });
            if (error) {
              alert(error.message.includes('duplicate') ? 'Je bidt al mee met dit verzoek.' : error.message);
              return;
            }
            alert('Dankjewel — je bidt mee.');
            render();
          });
        });
      }

      function bindDashboardActions(churchId) {
        document.getElementById('logout-btn')?.addEventListener('click', async () => {
          await supabaseClient.auth.signOut();
          location.hash = '#/';
        });

        document.querySelectorAll('[data-approve]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-approve');
            const { error } = await supabaseClient.from('prayer_requests').update({ approved: true }).eq('id', id);
            if (error) return alert(error.message);
            render();
          });
        });

        document.querySelectorAll('[data-answer]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-answer');
            const { error } = await supabaseClient.from('prayer_requests').update({ status: 'beantwoord' }).eq('id', id);
            if (error) return alert(error.message);
            render();
          });
        });
      }

      window.addEventListener('hashchange', render);
      supabaseClient.auth.onAuthStateChange(() => {
        if (currentHash().startsWith('/dashboard') || currentHash() === '/login') render();
      });
      render();
    </script>
  </body>
</html>
